<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Has the Key? C++ Friend Access</title>
<script src="../assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0c0f14; --s1:#131720; --s2:#1a2030; --s3:#212840;
  --border:#252d40; --border2:#303d55;
  --text:#d8e4f8; --muted:#7888a8; --dim:#3a4a62;
  --blue:#79c0ff; --green:#4ade80; --amber:#fbbd23;
  --red:#f87171; --purple:#c084fc; --cyan:#67e8f9; --orange:#fb923c;
  --code:'JetBrains Mono',monospace; --ui:'DM Sans',sans-serif; --r:8px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;min-height:100vh;display:flex;flex-direction:column}
header{padding:12px 22px;border-bottom:1px solid var(--border);background:var(--s1);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.title h1{font-size:16px;font-weight:600;letter-spacing:-.02em}.title p{font-family:var(--code);font-size:12px;color:var(--muted)}
.mode-strip{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--bg);display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.mode-card{border:1px solid var(--border2);background:var(--s1);border-radius:8px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:74px;position:relative;overflow:hidden}
.mode-card::before{content:'';position:absolute;inset:0 0 auto;height:2px;background:var(--accent,var(--blue));opacity:0;transition:opacity .15s}.mode-card:hover{background:var(--s2);border-color:var(--muted)}.mode-card.active{background:var(--s2);border-color:var(--accent,var(--blue))}.mode-card.active::before{opacity:1}
.mode-kicker{font-family:var(--code);font-size:10px;color:var(--accent,var(--blue));font-weight:600;text-transform:uppercase;letter-spacing:.08em}.mode-name{font-size:13px;color:var(--text);font-weight:600}.mode-desc{font-family:var(--code);font-size:10px;line-height:1.35;color:var(--muted)}
button{font-family:var(--ui);font-size:12px;font-weight:500;padding:6px 12px;border-radius:5px;cursor:pointer;border:1px solid var(--border2);background:var(--s3);color:var(--text);transition:all .12s}button:hover{background:var(--border2)}button:active{transform:scale(.98)}
.main{flex:1;display:grid;grid-template-columns:300px minmax(360px,1fr) 330px;gap:10px;min-height:0;padding:10px;background:var(--bg)}
.panel{min-height:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--s1)}.left,.center,.right{overflow:auto}.center{background:var(--bg)}
.window-bar{height:34px;background:var(--s2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;flex-shrink:0}
.traffic{display:flex;gap:6px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:block}.dot.red{background:#ff5f56}.dot.yellow{background:#ffbd2e}.dot.green{background:#27c93f}.window-title{font-family:var(--code);font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.center-content,.side-body{padding:16px;display:flex;flex-direction:column;gap:14px}.section{padding:13px 14px;border-bottom:1px solid var(--border)}.section-title,.side-title{font-family:var(--code);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:10px}.side-title{margin-bottom:0}
.preset-grid{display:flex;flex-wrap:wrap;gap:6px}.preset{font-family:var(--code);font-size:11px;padding:5px 8px;background:transparent;color:var(--muted)}.preset:hover{color:var(--text);border-color:var(--muted)}
.seg{display:flex;border:1px solid var(--border2);border-radius:6px;overflow:hidden;background:var(--s2)}.seg button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted);font-family:var(--code);font-size:11px;padding:7px 8px}.seg button.active{background:var(--s3);color:var(--text)}
.attempt-list{display:flex;flex-direction:column;gap:6px}.attempt{font-family:var(--code);font-size:11px;text-align:left;background:transparent;color:var(--muted);white-space:normal}.attempt.active{background:var(--s3);color:var(--text);border-color:var(--blue)}
.region-label{font-family:var(--code);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-bottom:8px;display:flex;align-items:center;gap:8px}.region-label::after{content:'';height:1px;background:var(--border);flex:1}
.code-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.code-box{position:relative;background:#080b10;border:1px solid var(--border2);border-radius:7px;padding:13px 14px;font-family:var(--code);font-size:12px;line-height:1.7;color:#a8d4ff;white-space:pre;overflow:auto;min-height:116px;max-width:100%}.code-box .label{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.kw{color:#ff7b72}.tp{color:#79c0ff}.fn{color:#d2a8ff}.cm{color:#4d5f78}.num{color:#79c0ff}
.class-house{border:1px solid var(--border2);border-radius:var(--r);background:var(--s1);overflow:hidden}.house-head{padding:10px 12px;background:var(--s2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}.house-name{font-family:var(--code);font-weight:600;color:var(--blue)}.badge{font-family:var(--code);font-size:10px;color:var(--muted);border:1px solid var(--border2);border-radius:4px;padding:2px 6px;background:var(--s1)}
.room{padding:12px;border-bottom:1px solid var(--border)}.room:last-child{border-bottom:0}.room.public{background:rgba(74,222,128,.04)}.room.private{background:rgba(248,113,113,.04)}.room.friend{background:rgba(251,189,35,.05)}.room-title{font-family:var(--code);font-size:11px;font-weight:600;margin-bottom:8px}.room.public .room-title{color:var(--green)}.room.private .room-title{color:var(--red)}.room.friend .room-title{color:var(--amber)}.member-line{font-family:var(--code);font-size:12px;color:var(--text);padding:3px 0}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:10px;align-items:center}.arrow{font-family:var(--code);font-size:22px;color:var(--dim);text-align:center}.actor-card,.result-card{background:var(--s2);border:1px solid var(--border2);border-radius:7px;overflow:hidden;min-width:0}.actor-head{padding:8px 10px;background:var(--s3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px;align-items:center}.actor-name{font-family:var(--code);font-weight:600;font-size:13px;color:var(--cyan)}.actor-body{font-family:var(--code);font-size:12px;color:var(--muted);line-height:1.55;padding:13px;text-align:center;min-height:78px;display:flex;align-items:center;justify-content:center}.granted{border-color:rgba(74,222,128,.45)}.denied{border-color:rgba(248,113,113,.45)}
.check-panel{border:1px solid var(--border2);border-radius:var(--r);background:var(--s2);overflow:hidden}.check-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--border)}.check-row:last-child{border-bottom:0}.check-k{font-family:var(--code);font-size:11px;color:var(--muted);padding:9px 10px;background:var(--s1)}.check-v{font-family:var(--code);font-size:12px;color:var(--text);padding:9px 10px}.status{font-weight:600}.status.ok{color:var(--green)}.status.no{color:var(--red)}
.note{padding:11px 13px;border-radius:7px;background:rgba(121,192,255,.05);border:1px solid rgba(121,192,255,.16);font-family:var(--code);font-size:12px;line-height:1.65;color:var(--muted)}.note strong{color:var(--blue);font-weight:600}.note.good{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.2)}.note.good strong{color:var(--green)}.note.warn{background:rgba(251,189,35,.06);border-color:rgba(251,189,35,.24)}.note.warn strong{color:var(--amber)}
.table{border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}.table-row{display:grid;grid-template-columns:1.4fr .6fr;border-bottom:1px solid var(--border)}.table-row:last-child{border-bottom:0}.table-cell{font-family:var(--code);font-size:12px;padding:9px 10px;background:var(--s2)}.table-head .table-cell{background:var(--s3);color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.yes{color:var(--green);font-weight:600}.no{color:var(--red);font-weight:600}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}.compare-card{border:1px solid var(--border2);border-radius:var(--r);background:var(--s1);overflow:hidden}.compare-head{padding:9px 11px;background:var(--s2);border-bottom:1px solid var(--border);font-family:var(--code);font-size:12px;font-weight:600}.compare-body{padding:12px}.bullets{font-family:var(--code);font-size:12px;color:var(--muted);line-height:1.8;padding-left:16px}
@media (max-width:1100px){.mode-strip{grid-template-columns:repeat(3,1fr)}}@media (max-width:980px){.main{grid-template-columns:1fr}.code-grid,.compare{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}@media (max-width:620px){.mode-strip{grid-template-columns:1fr}.mode-card{min-height:auto}.check-row{grid-template-columns:1fr}.table-row{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<header><div class="title"><h1>Who Has the Key? C++ Friend Access</h1><p>See how friend functions get controlled access to private data</p></div></header>

<nav class="mode-strip" aria-label="Learning modes">
  <button class="mode-card active" data-tab="private-wall" style="--accent:var(--blue)" onclick="setTab('private-wall')"><span class="mode-kicker">Mode 1</span><span class="mode-name">Private Wall</span><span class="mode-desc">Public door vs private room.</span></button>
  <button class="mode-card" data-tab="friend-function" style="--accent:var(--amber)" onclick="setTab('friend-function')"><span class="mode-kicker">Mode 2</span><span class="mode-name">Friend Function</span><span class="mode-desc">Grant one outside function a key.</span></button>
  <button class="mode-card" data-tab="streams" style="--accent:var(--green)" onclick="setTab('streams')"><span class="mode-kicker">Mode 3</span><span class="mode-name">Stream Operators</span><span class="mode-desc">Friend is optional, not required.</span></button>
  <button class="mode-card" data-tab="tradeoffs" style="--accent:var(--purple)" onclick="setTab('tradeoffs')"><span class="mode-kicker">Mode 4</span><span class="mode-name">Friend vs Getters</span><span class="mode-desc">Compare design tradeoffs.</span></button>
  <button class="mode-card" data-tab="rules" style="--accent:var(--cyan)" onclick="setTab('rules')"><span class="mode-kicker">Mode 5</span><span class="mode-name">Friendship Rules</span><span class="mode-desc">Granted, not mutual or inherited.</span></button>
</nav>

<div class="main">
  <aside class="panel left">
    <div class="window-bar"><div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><span class="window-title">controls</span></div>
    <div class="section">
      <div class="section-title">Presets</div>
      <div class="preset-grid">
        <button class="preset" onclick="preset('direct')">direct private access</button>
        <button class="preset" onclick="preset('getter')">public getter</button>
        <button class="preset" onclick="preset('noFriend')">no friend</button>
        <button class="preset" onclick="preset('friend')">friend declared</button>
        <button class="preset" onclick="preset('streamFriend')">stream friend</button>
        <button class="preset" onclick="preset('streamGetter')">stream getters</button>
        <button class="preset" onclick="preset('tradeoffs')">friend vs getters</button>
        <button class="preset" onclick="preset('rules')">friendship rules</button>
      </div>
    </div>
    <div class="section" id="attempt-controls">
      <div class="section-title">Access attempts</div>
      <div class="attempt-list">
        <button class="attempt active" data-attempt="direct-numerator" onclick="setAttempt('direct-numerator')">f.numerator;</button>
        <button class="attempt" data-attempt="getter-numerator" onclick="setAttempt('getter-numerator')">f.getNumerator();</button>
        <button class="attempt" data-attempt="direct-denominator" onclick="setAttempt('direct-denominator')">f.denominator;</button>
        <button class="attempt" data-attempt="getter-denominator" onclick="setAttempt('getter-denominator')">f.getDenominator();</button>
      </div>
    </div>
    <div class="section" id="friend-controls" style="display:none">
      <div class="section-title">Friend declaration</div>
      <div class="seg"><button id="friend-off" class="active" onclick="setFriend(false)">no friend</button><button id="friend-on" onclick="setFriend(true)">friend declared</button></div>
    </div>
    <div class="section" id="stream-controls" style="display:none">
      <div class="section-title">Access style</div>
      <div class="seg"><button id="stream-friend" class="active" onclick="setStreamAccess('friend')">friend access</button><button id="stream-getters" onclick="setStreamAccess('getters')">public getters</button></div>
    </div>
  </aside>

  <main class="panel center">
    <div class="window-bar"><div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><span class="window-title" id="center-title">private wall</span></div>
    <div class="center-content" id="center-output"></div>
  </main>

  <aside class="panel right">
    <div class="window-bar"><div class="traffic"><span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span></div><span class="window-title">access result</span></div>
    <div class="side-body" id="right-output"></div>
  </aside>
</div>

<script>
'use strict';

const state = {
  tab: 'private-wall',
  friendDeclared: false,
  streamAccess: 'friend',
  selectedAttempt: 'direct-numerator'
};

const attempts = {
  'direct-numerator': { code:'f.numerator;', caller:'Outside code', member:'numerator', privateMember:'Yes', route:'direct private access', allowed:false },
  'getter-numerator': { code:'f.getNumerator();', caller:'Outside code', member:'getNumerator()', privateMember:'No, public member function', route:'public door', allowed:true },
  'direct-denominator': { code:'f.denominator;', caller:'Outside code', member:'denominator', privateMember:'Yes', route:'direct private access', allowed:false },
  'getter-denominator': { code:'f.getDenominator();', caller:'Outside code', member:'getDenominator()', privateMember:'No, public member function', route:'public door', allowed:true }
};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function code(s){return esc(s).replace(/\b(class|private|public|const|return|void|int|friend|bool|if)\b/g,'<span class="kw">$1</span>').replace(/\b(Fraction|std::ostream|std::istream|A|B|C|ChildOfB)\b/g,'<span class="tp">$1</span>').replace(/\b(operator<<|operator>>|printFraction|trustedFunction|getNumerator|getDenominator)\b/g,'<span class="fn">$1</span>');}
function classCode(includeFriend=false, includeGetters=true){
  return `class Fraction {
private:
    int numerator;
    int denominator;

public:
    Fraction(int n, int d) : numerator(n), denominator(d) {}
${includeGetters ? '\n    int getNumerator() const { return numerator; }\n    int getDenominator() const { return denominator; }' : ''}
${includeFriend ? '\n    friend void printFraction(const Fraction& f);' : ''}
};`;
}
function house(friend=false){
  return `<div class="class-house">
    <div class="house-head"><span class="house-name">Fraction</span><span class="badge">class</span></div>
    <div class="room public"><div class="room-title">public front door</div><div class="member-line">Fraction(int n, int d)</div><div class="member-line">getNumerator()</div><div class="member-line">getDenominator()</div></div>
    <div class="room private"><div class="room-title">private room / locked</div><div class="member-line">numerator</div><div class="member-line">denominator</div></div>
    ${friend ? '<div class="room friend"><div class="room-title">friend key granted</div><div class="member-line">printFraction(const Fraction& f)</div></div>' : ''}
  </div>`;
}
function setTab(tab){
  state.tab = tab;
  document.querySelectorAll('.mode-card').forEach(b=>b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('attempt-controls').style.display = tab === 'private-wall' ? 'block' : 'none';
  document.getElementById('friend-controls').style.display = tab === 'friend-function' ? 'block' : 'none';
  document.getElementById('stream-controls').style.display = tab === 'streams' ? 'block' : 'none';
  const titles = {'private-wall':'private wall','friend-function':'friend function','streams':'stream operators','tradeoffs':'friend vs getters','rules':'friendship rules'};
  document.getElementById('center-title').textContent = titles[tab] || 'friend access';
  render();
}
function setAttempt(id){state.selectedAttempt=id;document.querySelectorAll('.attempt').forEach(b=>b.classList.toggle('active',b.dataset.attempt===id));render();}
function setFriend(v){state.friendDeclared=v;document.getElementById('friend-off').classList.toggle('active',!v);document.getElementById('friend-on').classList.toggle('active',v);render();}
function setStreamAccess(v){state.streamAccess=v;document.getElementById('stream-friend').classList.toggle('active',v==='friend');document.getElementById('stream-getters').classList.toggle('active',v==='getters');render();}
function preset(name){
  if(name==='direct'){setTab('private-wall');setAttempt('direct-numerator');}
  if(name==='getter'){setTab('private-wall');setAttempt('getter-numerator');}
  if(name==='noFriend'){setTab('friend-function');setFriend(false);}
  if(name==='friend'){setTab('friend-function');setFriend(true);}
  if(name==='streamFriend'){setTab('streams');setStreamAccess('friend');}
  if(name==='streamGetter'){setTab('streams');setStreamAccess('getters');}
  if(name==='tradeoffs'){setTab('tradeoffs');}
  if(name==='rules'){setTab('rules');}
}
function accessCheck(a){
  return `<div class="check-panel">
    <div class="check-row"><div class="check-k">Who is trying?</div><div class="check-v">${esc(a.caller)}</div></div>
    <div class="check-row"><div class="check-k">Member accessed</div><div class="check-v">${esc(a.member)}</div></div>
    <div class="check-row"><div class="check-k">Is it private?</div><div class="check-v">${esc(a.privateMember)}</div></div>
    <div class="check-row"><div class="check-k">Route</div><div class="check-v">${esc(a.route)}</div></div>
    <div class="check-row"><div class="check-k">Result</div><div class="check-v status ${a.allowed?'ok':'no'}">${a.allowed?'Access granted':'Access denied'}</div></div>
  </div>`;
}
function renderPrivateWall(){
  const a = attempts[state.selectedAttempt];
  document.getElementById('center-output').innerHTML = `<div class="code-grid"><div><div class="region-label">Fraction class</div><div class="code-box">${code(classCode(false,true))}</div></div><div><div class="region-label">Selected access attempt</div><div class="code-box">${code(a.code)} ${a.allowed ? '// allowed' : '// error: private access denied'}</div></div></div><div class="region-label">Access model</div>${house(false)}`;
  document.getElementById('right-output').innerHTML = `<div class="side-title">Access check</div>${accessCheck(a)}<div class="note"><strong>private means locked room.</strong><br>Outside code cannot touch private fields directly. It can use the public front door: constructors, public methods, and getters.</div>`;
}
function renderFriendFunction(){
  const friend = state.friendDeclared;
  const fn = `void printFraction(const Fraction& f) {
    std::cout << f.numerator << "/" << f.denominator;
}`;
  document.getElementById('center-output').innerHTML = `<div class="code-grid"><div><div class="region-label">${friend?'Friend version':'Normal outside function'}</div><div class="code-box">${code(friend?classCode(true,false)+'\n\n'+fn:classCode(false,false)+'\n\n'+fn)}</div></div><div><div class="region-label">Call syntax</div><div class="code-box">${code('Fraction f(1, 2);\n\nprintFraction(f);      // normal function call\n// not f.printFraction();')}</div></div></div><div class="region-label">Who has access?</div><div class="flow"><div class="actor-card ${friend?'granted':'denied'}"><div class="actor-head"><span class="actor-name">printFraction</span><span class="badge">outside function</span></div><div class="actor-body">${friend?'has friend key':'blocked at private wall'}</div></div><div class="arrow">-></div>${house(friend)}<div class="arrow">=</div><div class="result-card ${friend?'granted':'denied'}"><div class="actor-head"><span class="actor-name">${friend?'access granted':'access denied'}</span><span class="badge">${friend?'friend':'no friend'}</span></div><div class="actor-body">${friend?'Can read numerator and denominator directly.':'Error: numerator and denominator are private.'}</div></div></div>`;
  document.getElementById('right-output').innerHTML = `<div class="side-title">Key facts</div><div class="note"><strong>A friend function is not a member function.</strong><br>It does not get a <code>this</code> pointer, and it is called like a normal function: <code>printFraction(f)</code>.</div><div class="note good"><strong>Friendship is granted, not taken.</strong><br><code>Fraction</code> grants this one outside function permission by declaring it as <code>friend</code>.</div><div class="note warn"><strong>Use friend intentionally and sparingly.</strong><br>It is a controlled exception to encapsulation, not the default design move.</div>`;
}
function renderStreams(){
  const friend = state.streamAccess === 'friend';
  const friendCode = `class Fraction {
private:
    int numerator;
    int denominator;

public:
    friend std::ostream& operator<<(std::ostream& out, const Fraction& f);
};

std::ostream& operator<<(std::ostream& out, const Fraction& f) {
    out << f.numerator << "/" << f.denominator;
    return out;
}`;
  const getterCode = `class Fraction {
private:
    int numerator;
    int denominator;

public:
    int getNumerator() const { return numerator; }
    int getDenominator() const { return denominator; }
};

std::ostream& operator<<(std::ostream& out, const Fraction& f) {
    out << f.getNumerator() << "/" << f.getDenominator();
    return out;
}`;
  document.getElementById('center-output').innerHTML = `<div class="code-grid"><div><div class="region-label">Stream syntax</div><div class="code-box">${code('std::cout << f;\nstd::cin >> f;\n\noperator<<(std::cout, f);\noperator>>(std::cin, f);')}</div></div><div><div class="region-label">${friend?'Friend version':'Getter version'}</div><div class="code-box">${code(friend?friendCode:getterCode)}</div></div></div><div class="region-label">Chaining</div><div class="code-box">${code('std::cout << a << b;\n\noperator<<(operator<<(std::cout, a), b);')}</div><div class="flow"><div class="actor-card"><div class="actor-head"><span class="actor-name">std::cout</span><span class="badge">left operand</span></div><div class="actor-body">goes into operator&lt;&lt;</div></div><div class="arrow">-></div><div class="actor-card granted"><div class="actor-head"><span class="actor-name">operator&lt;&lt;</span><span class="badge">returns stream&</span></div><div class="actor-body">same cout is returned</div></div><div class="arrow">-></div><div class="actor-card"><div class="actor-head"><span class="actor-name">next &lt;&lt;</span><span class="badge">chain</span></div><div class="actor-body">returned cout is reused</div></div></div>`;
  document.getElementById('right-output').innerHTML = `<div class="side-title">Teaching note</div><div class="note good"><strong>friend is optional, not required.</strong><br>Stream operators are usually non-member functions. They are often friends, but friend is only needed if the operator needs direct access to private data.</div><div class="note"><strong>The stream is on the left.</strong><br>Because <code>std::cout</code> and <code>std::cin</code> are the left operands, these operators are usually written as non-member functions.</div><div class="check-panel"><div class="check-row"><div class="check-k">friend access</div><div class="check-v">uses private members directly</div></div><div class="check-row"><div class="check-k">getter access</div><div class="check-v">uses the public interface; friend is not needed</div></div></div>`;
}
function renderTradeoffs(){
  const friendCode = `class Fraction {
private:
    int numerator;
    int denominator;

public:
    friend void printFraction(const Fraction& f);
};

void printFraction(const Fraction& f) {
    std::cout << f.numerator << "/" << f.denominator;
}`;
  const getterCode = `class Fraction {
private:
    int numerator;
    int denominator;

public:
    int getNumerator() const { return numerator; }
    int getDenominator() const { return denominator; }
};

void printFraction(const Fraction& f) {
    std::cout << f.getNumerator() << "/" << f.getDenominator();
}`;
  document.getElementById('center-output').innerHTML = `<div class="code-grid"><div><div class="region-label">Version A: friend function</div><div class="code-box">${code(friendCode)}</div></div><div><div class="region-label">Version B: public getters</div><div class="code-box">${code(getterCode)}</div></div></div><div class="compare"><div class="compare-card"><div class="compare-head">Friend function</div><div class="compare-body"><ul class="bullets"><li>Gives one specific function direct access</li><li>Keeps data from being publicly exposed</li><li>Creates a controlled exception to encapsulation</li><li>Can be overused</li></ul></div></div><div class="compare-card"><div class="compare-head">Public getters</div><div class="compare-body"><ul class="bullets"><li>Uses normal public interface</li><li>No friend needed</li><li>Exposes data to everyone</li><li>Often simpler and clearer</li></ul></div></div></div>`;
  document.getElementById('right-output').innerHTML = `<div class="side-title">Design prompt</div><div class="note warn"><strong>Question:</strong><br>Do we want every outside function to be able to read numerator and denominator, or only this one trusted function?</div><div class="note"><strong>friend is not bad.</strong><br>It should be intentional. If you find yourself making many friend functions, your class design may need work.</div>`;
}
function renderRules(){
  document.getElementById('center-output').innerHTML = `<div class="code-grid"><div><div class="region-label">Granted, not taken</div><div class="code-box">${code('class A {\nprivate:\n    int secret;\n\n    friend void trustedFunction(const A& a);\n};')}</div></div><div><div class="region-label">Not mutual / inherited / transitive</div><div class="code-box">${code('class A {\n    friend class B;\n};\n\nclass ChildOfB : public B {\n};\n\nclass B {\n    friend class C;\n};')}</div></div></div><div class="region-label">Permission matrix</div><div class="table"><div class="table-row table-head"><div class="table-cell">Scenario</div><div class="table-cell">Allowed?</div></div><div class="table-row"><div class="table-cell">B accesses A private</div><div class="table-cell yes">yes</div></div><div class="table-row"><div class="table-cell">A accesses B private</div><div class="table-cell no">no</div></div><div class="table-row"><div class="table-cell">ChildOfB accesses A private</div><div class="table-cell no">no</div></div><div class="table-row"><div class="table-cell">C accesses A private</div><div class="table-cell no">no</div></div></div>`;
  document.getElementById('right-output').innerHTML = `<div class="side-title">Rules</div><div class="note good"><strong>Rule 1:</strong> Friendship is granted, not taken. A decides who its friends are.</div><div class="note"><strong>Rule 2:</strong> Friendship is not mutual. If B can access A, A does not automatically access B.</div><div class="note"><strong>Rule 3:</strong> Friendship is not inherited. ChildOfB does not automatically get B's access.</div><div class="note"><strong>Rule 4:</strong> Friendship is not transitive. C can access B, but that does not automatically mean C can access A.</div>`;
}
function render(){
  if(state.tab==='private-wall') renderPrivateWall();
  if(state.tab==='friend-function') renderFriendFunction();
  if(state.tab==='streams') renderStreams();
  if(state.tab==='tradeoffs') renderTradeoffs();
  if(state.tab==='rules') renderRules();
}
render();
</script>

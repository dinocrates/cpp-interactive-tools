<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ Lambda Functions Lab</title>
<script src="../assets/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0f14;--s1:#131720;--s2:#1a2030;--s3:#212840;--border:#252d40;--border2:#303d55;--text:#d8e4f8;--muted:#8292af;--dim:#52637e;--blue:#79c0ff;--green:#4ade80;--amber:#fbbd23;--red:#f87171;--purple:#c084fc;--cyan:#67e8f9;--orange:#fb923c;--code:'JetBrains Mono',monospace;--ui:'DM Sans',sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;min-height:100vh}button,input,select{font:inherit}
header{padding:13px 22px;border-bottom:1px solid var(--border);background:var(--s1);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:10}h1{font-size:17px;letter-spacing:-.02em}header p{font:11px var(--code);color:var(--muted);margin-top:2px}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab{border:1px solid var(--border2);background:var(--s2);color:var(--muted);border-radius:5px;padding:7px 11px;cursor:pointer;font:11px var(--code)}.tab:hover{color:var(--text)}.tab.active{border-color:var(--purple);background:rgba(192,132,252,.1);color:var(--purple)}
.layout{display:grid;grid-template-columns:250px minmax(420px,1fr) 300px;min-height:calc(100vh - 65px)}.panel{min-width:0}.controls{background:var(--s1);border-right:1px solid var(--border)}.stage{padding:20px;overflow:auto}.lesson{background:var(--s1);border-left:1px solid var(--border);padding:16px}.phead{padding:10px 14px;border-bottom:1px solid var(--border);background:var(--s2);font:600 10px var(--code);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.control{padding:13px 14px;border-bottom:1px solid var(--border)}label,.label{display:block;font:600 10px var(--code);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}input[type=number],select{width:100%;background:#080b10;color:var(--text);border:1px solid var(--border2);border-radius:5px;padding:7px 8px;font:12px var(--code)}
.choices{display:grid;gap:6px}.choice{cursor:pointer;text-align:left;padding:8px 10px;border-radius:5px;border:1px solid var(--border2);background:var(--s2);color:var(--muted);font:11px var(--code)}.choice:hover{color:var(--text);border-color:var(--muted)}.choice.active{color:var(--cyan);border-color:var(--cyan);background:rgba(103,232,249,.08)}.primary{width:100%;cursor:pointer;padding:8px;border-radius:5px;border:1px solid var(--green);color:var(--green);background:rgba(74,222,128,.08);font:600 11px var(--code)}.primary:hover{background:rgba(74,222,128,.15)}
.region{font:600 10px var(--code);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:9px;margin-bottom:8px}.region::after{content:'';height:1px;background:var(--border);flex:1}.code{background:#080b10;border:1px solid var(--border2);border-radius:7px;padding:14px;white-space:pre;overflow:auto;font:12px/1.75 var(--code);color:#b9d9f5}.kw{color:#ff7b72}.type{color:var(--blue)}.cap{color:var(--cyan)}.num{color:var(--amber)}.cm{color:#65738d}.fn{color:var(--purple)}
.stack{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin:18px 0}.box{border:1px solid var(--border2);border-radius:8px;background:var(--s1);overflow:hidden}.box-head{padding:7px 10px;border-bottom:1px solid var(--border);background:var(--s2);font:600 11px var(--code)}.box-body{padding:13px}.memory{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border2);background:var(--s2);border-radius:5px;padding:9px 11px;font:12px var(--code);margin-top:7px}.memory strong{color:var(--amber)}.arrow{color:var(--purple);font:20px var(--code)}.badge{display:inline-block;border-radius:12px;padding:2px 8px;font:10px var(--code);border:1px solid var(--border2);color:var(--muted)}.badge.live{border-color:var(--green);color:var(--green)}.badge.copy{border-color:var(--amber);color:var(--amber)}
.anatomy{display:flex;flex-wrap:wrap;gap:4px;margin:14px 0}.part{padding:10px 12px;border:1px solid var(--border2);border-radius:6px;background:var(--s1);font:12px var(--code);cursor:pointer}.part:hover,.part.active{border-color:var(--purple);background:rgba(192,132,252,.09)}.part span{color:var(--purple)}
.note{padding:11px 12px;border:1px solid var(--border2);border-radius:6px;background:var(--s2);font:12px/1.65 var(--code);color:var(--muted);margin-bottom:10px}.note strong{color:var(--text)}.note.good{border-color:rgba(74,222,128,.3)}.note.warn{border-color:rgba(251,189,35,.35)}.result{padding:12px 14px;border:1px solid rgba(74,222,128,.3);background:rgba(74,222,128,.07);border-radius:6px;color:var(--green);font:12px var(--code);margin-top:12px}.hidden{display:none!important}.pipeline{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap;margin:16px 0}.step{flex:1;min-width:110px;padding:12px;border:1px solid var(--border2);border-radius:7px;background:var(--s1);font:11px/1.5 var(--code)}.step strong{display:block;color:var(--cyan);margin-bottom:4px}.step-arrow{align-self:center;color:var(--dim)}.values{display:flex;gap:6px;flex-wrap:wrap}.value{width:38px;height:38px;display:grid;place-items:center;border-radius:6px;background:var(--s2);border:1px solid var(--border2);font:12px var(--code)}.value.keep{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.08)}.value.drop{opacity:.35;text-decoration:line-through}
@media(max-width:1000px){.layout{grid-template-columns:220px 1fr}.lesson{grid-column:1/-1;border-left:0;border-top:1px solid var(--border)}header{position:static}}@media(max-width:680px){.layout{display:block}.controls{border-right:0}.stack{grid-template-columns:1fr}.arrow{transform:rotate(90deg);text-align:center}.stage{padding:14px}}
</style>
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
<header><div><h1>Lambda Functions Lab</h1><p>anonymous functions · captures · closures · algorithms</p></div><div class="tabs"><button class="tab active" data-tab="anatomy">1. Anatomy</button><button class="tab" data-tab="captures">2. Captures</button><button class="tab" data-tab="calls">3. Calls</button><button class="tab" data-tab="algorithms">4. Algorithms</button></div></header>
<div class="layout">
  <aside class="panel controls" id="controls"></aside>
  <main class="panel stage" id="stage"></main>
  <aside class="panel lesson" id="lesson"></aside>
</div>
<script>
const state={tab:'anatomy',part:'capture',capture:'x',outside:10,snapshot:10,created:true,param:4,algorithm:'filter',threshold:4};
const parts={capture:['Capture list','Chooses which outside variables become part of the closure object.'],params:['Parameters','Inputs supplied each time the lambda is called.'],mutable:['mutable','Allows a value-captured copy to change inside the lambda.'],return:['Return type','Usually inferred. Write -> type when you need to be explicit.'],body:['Body','The statements executed whenever the closure is called.']};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function syntax(capture='x'){return `<span class="kw">auto</span> add = <span class="cap">[${esc(capture)}]</span>(<span class="type">int</span> n) <span class="kw">mutable</span> <span class="type">-&gt; int</span> {\n    <span class="kw">return</span> x + n;\n};`}
function setTab(tab){state.tab=tab;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
function choosePart(p){state.part=p;render()}
function setCapture(c){state.capture=c;state.snapshot=state.outside;state.created=true;render()}
function createLambda(){state.snapshot=state.outside;state.created=true;render()}
function changeOutside(delta){state.outside+=delta;render()}
function captureInfo(){const c=state.capture;const ref=c==='&'||c==='&x';const none=c==='';return {ref,none,label:none?'captures nothing':ref?'stores a reference to x':'stores a copy of x',inside:none?'unavailable':ref?state.outside:state.snapshot}}
function controls(){
 if(state.tab==='anatomy')return `<div class="phead">Explore the syntax</div><div class="control"><div class="label">Click a lambda part</div><div class="choices">${Object.keys(parts).map(p=>`<button class="choice ${state.part===p?'active':''}" onclick="choosePart('${p}')">${p}</button>`).join('')}</div></div>`;
 if(state.tab==='captures')return `<div class="phead">Build the closure</div><div class="control"><div class="label">Capture list</div><div class="choices">${[['','[] nothing'],['x','[x] value'],['&x','[&x] reference'],['=','[=] all by value'],['&','[&] all by reference']].map(([v,l])=>`<button class="choice ${state.capture===v?'active':''}" onclick="setCapture('${v}')">${l}</button>`).join('')}</div></div><div class="control"><div class="label">Outside x = ${state.outside}</div><div style="display:flex;gap:6px"><button class="choice" onclick="changeOutside(-1)">− 1</button><button class="choice" onclick="changeOutside(1)">+ 1</button></div></div><div class="control"><button class="primary" onclick="createLambda()">Re-create lambda now</button></div>`;
 if(state.tab==='calls')return `<div class="phead">Call the lambda</div><div class="control"><label for="param">Argument n</label><input id="param" type="number" value="${state.param}" oninput="state.param=Number(this.value);renderStage()"></div><div class="control"><div class="label">Capture behavior</div><div class="choices"><button class="choice ${state.capture==='x'?'active':''}" onclick="setCapture('x');state.tab='calls';render()">[x] value</button><button class="choice ${state.capture==='&x'?'active':''}" onclick="setCapture('&x');state.tab='calls';render()">[&x] reference</button></div></div>`;
 return `<div class="phead">STL algorithm</div><div class="control"><div class="label">Operation</div><div class="choices"><button class="choice ${state.algorithm==='filter'?'active':''}" onclick="state.algorithm='filter';render()">filter with copy_if</button><button class="choice ${state.algorithm==='sort'?'active':''}" onclick="state.algorithm='sort';render()">sort with comparator</button><button class="choice ${state.algorithm==='transform'?'active':''}" onclick="state.algorithm='transform';render()">transform values</button></div></div><div class="control"><label>Threshold / factor: ${state.threshold}</label><input type="range" min="1" max="8" value="${state.threshold}" oninput="state.threshold=Number(this.value);renderStage()"></div>`;
}
function anatomy(){const [title,desc]=parts[state.part];return `<div class="region">Lambda expression</div><div class="code">${syntax('x')}</div><div class="anatomy">${Object.keys(parts).map(p=>`<button class="part ${p===state.part?'active':''}" onclick="choosePart('${p}')"><span>${p==='capture'?'[x]':p==='params'?'(int n)':p==='mutable'?'mutable':p==='return'?'-&gt; int':'{ ... }'}</span><br>${parts[p][0]}</button>`).join('')}</div><div class="box"><div class="box-head">${title}</div><div class="box-body">${desc}</div></div><div class="region" style="margin-top:18px">What auto means here</div><div class="note"><strong>The lambda has a unique, unnamed class type.</strong> The compiler creates a closure object and <code>auto</code> gives that object a usable variable name: <code>add</code>.</div>`}
function captures(){const i=captureInfo();const invalid=i.none;return `<div class="region">Code generated by your choices</div><div class="code">${syntax(state.capture)}\n\n<span class="type">int</span> answer = add(5); ${invalid?'<span class="cm">// error: x was not captured</span>':''}</div><div class="stack"><div class="box"><div class="box-head">surrounding scope</div><div class="box-body"><span class="badge live">live variable</span><div class="memory"><span>int x</span><strong>${state.outside}</strong></div></div></div><div class="arrow">→</div><div class="box"><div class="box-head">closure object: add</div><div class="box-body"><span class="badge ${i.ref?'live':'copy'}">${i.label}</span><div class="memory"><span>captured x</span><strong>${i.inside}</strong></div></div></div></div>${invalid?'<div class="result" style="color:var(--red);border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.07)">Compile error: x is used in the body but [] captures nothing.</div>':`<div class="result">add(5) → ${i.inside} + 5 → ${i.inside+5}</div>`}`}
function calls(){const i=captureInfo(),result=i.inside+state.param;return `<div class="region">Define once, call many times</div><div class="code">${syntax(state.capture)}\n\n<span class="type">int</span> result = <span class="fn">add</span>(<span class="num">${state.param}</span>);</div><div class="pipeline"><div class="step"><strong>1 · closure</strong>captured x = ${i.inside}</div><div class="step-arrow">→</div><div class="step"><strong>2 · argument</strong>parameter n = ${state.param}</div><div class="step-arrow">→</div><div class="step"><strong>3 · body</strong>${i.inside} + ${state.param}</div><div class="step-arrow">→</div><div class="step"><strong>4 · return</strong>${result}</div></div><div class="result">result contains ${result}</div>`}
function algorithms(){let nums=[7,2,5,1,8,3],out,code,mark;if(state.algorithm==='filter'){out=nums.filter(n=>n>state.threshold);code=`std::copy_if(values.begin(), values.end(),\n    std::back_inserter(result),\n    [limit](int n) { return n &gt; limit; });`;mark=n=>n>state.threshold?'keep':'drop'}else if(state.algorithm==='sort'){out=[...nums].sort((a,b)=>Math.abs(a-state.threshold)-Math.abs(b-state.threshold));code=`std::sort(values.begin(), values.end(),\n    [target](int a, int b) {\n        return std::abs(a-target) &lt; std::abs(b-target);\n    });`;mark=()=> 'keep'}else{out=nums.map(n=>n*state.threshold);code=`std::transform(values.begin(), values.end(), values.begin(),\n    [factor](int n) { return n * factor; });`;mark=()=> 'keep'}return `<div class="region">Lambda as behavior</div><div class="code">${esc(code)}</div><div class="pipeline"><div class="step"><strong>input</strong><div class="values">${nums.map(n=>`<span class="value ${mark(n)}">${n}</span>`).join('')}</div></div><div class="step-arrow">→</div><div class="step"><strong>algorithm calls lambda</strong>${state.algorithm==='filter'?'keep n > ':state.algorithm==='sort'?'closest to ':'multiply by '}${state.threshold}</div><div class="step-arrow">→</div><div class="step"><strong>result</strong><div class="values">${out.map(n=>`<span class="value keep">${n}</span>`).join('')}</div></div></div><div class="note good"><strong>The algorithm owns the loop; the lambda supplies the rule.</strong> This separation is one of the most useful reasons lambdas exist.</div>`}
function lesson(){const content={anatomy:['A lambda is an expression that creates a callable object.','The semicolon belongs to the variable declaration, not the lambda body.','Parameters work like ordinary function parameters.'],captures:['Value capture is a snapshot taken when the lambda is created.','Reference capture follows the original variable as it changes.','References must not outlive the variables they refer to.'],calls:['Calling a closure uses ordinary function-call syntax.','The capture supplies stored context; parameters supply per-call inputs.','Return types are normally inferred from return statements.'],algorithms:['Lambdas make short rules readable next to the algorithm using them.','Predicates return bool; comparators answer whether a comes before b.','Prefer explicit captures when clarity matters.']}[state.tab];return `<div class="phead">Key ideas</div>${content.map((n,i)=>`<div class="note ${i===0?'good':i===2?'warn':''}">${n}</div>`).join('')}<div class="note"><strong>Read it aloud:</strong><br>${state.tab==='captures'?`“Capture ${captureInfo().label}, take an int n, and return x plus n.”`:'“Create a small callable object and use it where behavior is needed.”'}</div>`}
function renderStage(){document.getElementById('stage').innerHTML=state.tab==='anatomy'?anatomy():state.tab==='captures'?captures():state.tab==='calls'?calls():algorithms();document.getElementById('lesson').innerHTML=lesson()}
function render(){document.getElementById('controls').innerHTML=controls();renderStage()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));render();
</script>
</body>
</html>
